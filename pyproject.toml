[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catlab-tools"
dynamic = ["version"]
description = "ODS kinetics fitting and catalyst analysis suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hoda Jafari" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.30",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff~=0.15.0",
]

[tool.setuptools]
packages = ["catlab"]

[tool.setuptools.dynamic]
version = { attr = "catlab.__version__" }

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests (validation harness determinism), run with `-m slow`",
]
addopts = "-m \"not slow\""

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv", "tests/data"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]          # long lines are left to the formatter

[tool.ruff.lint.per-file-ignores]
"app_ods.py" = ["E402"]    # matplotlib.use("Agg") must run before pyplot import
"catlab/__init__.py" = ["F401"]   # public re-exports
